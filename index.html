<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基層模擬器</title>
    <!-- 網頁分頁圖示 (Favicon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>">
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- 引入 Babel 以在瀏覽器中編譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* 隱藏捲軸以美化介面，增添現代感 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 數值跳動動畫 */
        .animate-bounce-custom { animation: bounce-custom 0.3s ease-in-out; }
        @keyframes bounce-custom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* 載入動畫 */
        .fade-in-up { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 確保底部選單不會遮擋最後一個選項 */
        body { padding-bottom: 80px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVG 圖示組件 ---
        const IconHome = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const IconUtensils = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>;
        const IconArrowRight = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
        const IconBookOpen = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
        const IconStethoscope = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>;
        const IconAlertCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        const IconCheckCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>;
        const IconShirt = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20.38 3.46 16 2a8 8 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>;
        const IconActivity = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>;
        const IconStar = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const IconUsers = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconHeartCrack = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="m12 13-1-1 2-2-3-3 2-2"/></svg>;
        const IconCoin = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>;
        const IconXCircle = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>;

        const PovertySim = () => {
            const INCOME = 11850; // 基層家庭固定月入
            
            // 加入遊戲階段狀態與載入進度
            const [gamePhase, setGamePhase] = useState('loading'); // 'loading' 載入中, 'intro' 首頁, 'playing' 遊戲中
            const [loadingProgress, setLoadingProgress] = useState(0);

            // 將所有預設選擇設為 null，強制玩家必須對每個範疇表態
            const [choices, setChoices] = useState({
                housing: null,
                food: null,
                transport: null,
                education: null,
                medical: null,
                utilities: null,
                clothes: null
            });

            const [showResult, setShowResult] = useState(false);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [unselectedList, setUnselectedList] = useState([]);
            const [animationClass, setAnimationClass] = useState('');
            
            // 資料庫更新：使用 GitHub 本地的 images 資料夾圖片
            const categories = [
                {
                    id: 'housing',
                    title: '居住環境 (Housing)',
                    icon: <IconHome className="w-6 h-6 text-blue-500" />,
                    options: [
                        { price: 7500, label: '舊樓兩房單位', desc: '雖然舊但有獨立房窗，位於市區。', quality: '🙂', impact: '', image: 'images/1.jpg' },
                        { price: 4800, label: '深水埗劏房', desc: '120呎，廚廁合一。', quality: '😐', impact: '空間極度擠迫，油煙味重，兄妹無處轉身，容易因爭奪空間而吵架。', concept: '#空間貧窮', affects: { quality: 1, relationship: 1, health: 0.5 }, image: 'images/2.jpg' },
                        { price: 3500, label: '偏遠村屋/唐樓', desc: '新界偏遠地區或高層無升降機唐樓。', quality: '😢', impact: '雖然租金較低，但交通費高昂且通勤極長（時間貧窮）。上落樓梯體力透支，環境衛生較差。', concept: '#居住不公', affects: { quality: 1.2, relationship: 1, health: 1 }, image: 'images/3.jpg' }
                    ],
                    abandonOption: { impact: '失去避風港，面對極端天氣威脅，缺乏安全感及基本衛生條件，隨時面臨被驅趕，身心崩潰。', concept: '#無家者', affects: { quality: 3.5, relationship: 2, health: 3.5 } }
                },
                {
                    id: 'food',
                    title: '膳食開支 (Food)',
                    icon: <IconUtensils className="w-6 h-6 text-orange-500" />,
                    options: [
                        { price: 4500, label: '街市買餸煮飯', desc: '堅持每日新鮮食材，三餸一湯。', quality: '🙂', impact: '', image: 'images/4.jpg' },
                        { price: 3000, label: '急凍與特價品', desc: '主要購買超市特價與急凍肉，自行煮食。', quality: '😐', impact: '營養攝取不均，長期食用急凍肉類，缺乏新鮮蔬果，孩子體質較弱。', concept: '#隱性飢餓', affects: { quality: 0.5, relationship: 0, health: 0.5 }, image: 'images/5.jpg' },
                        { price: 3500, label: '廉價兩餸飯/快餐', desc: '因疲勞無暇煮食，全家吃平價外賣。', quality: '😢', impact: '長期攝取高油鹽糖（三高），缺乏膳食纖維，增加患病風險，失去家庭交流時光。', concept: '#食物不安全', affects: { quality: 0.8, relationship: 0.8, health: 1.2 }, image: 'images/6.jpg' }
                    ],
                    abandonOption: { impact: '嚴重飢餓與營養不良，隨時有生命危險，失去生而為人的尊嚴。', concept: '#極端飢餓', affects: { quality: 3, relationship: 1.5, health: 4 } }
                },
                {
                    id: 'transport',
                    title: '交通選擇 (Transport)',
                    icon: <IconArrowRight className="w-6 h-6 text-gray-500" />,
                    options: [
                        { price: 1200, label: '港鐵與巴士', desc: '正常通勤，確保睡眠時間。', quality: '🙂', impact: '', image: 'images/7.jpg' },
                        { price: 100, label: '步行或踩單車', desc: '極限節省，無論多遠都盡量不搭車。', quality: '😢', impact: '日曬雨淋極度消耗體力。回家後累得無法與家人互動，且伴隨馬路安全風險。', concept: '#時間貧窮', affects: { quality: 0.8, relationship: 1.2, health: 1 }, image: 'images/8.jpg' }
                    ],
                    abandonOption: { impact: '失去所有正常社交、遠區工作及學習的機會，與社會徹底脫節，形同自我囚禁。', concept: '#社會孤立', affects: { quality: 2, relationship: 3, health: 1.5 } }
                },
                {
                    id: 'education',
                    title: '子女教育 (Education)',
                    icon: <IconBookOpen className="w-6 h-6 text-green-600" />,
                    options: [
                        { price: 2500, label: '補習與興趣班', desc: '專科補習+興趣班(如畫畫)', quality: '🙂', impact: '', image: 'images/9.jpg' },
                        { price: 1500, label: '只補主科', desc: '只補英文/數學，放棄興趣班。', quality: '😐', impact: '保住了學業基本盤，但生活只剩下讀書與考試。缺乏才藝發展，同儕話題減少。', concept: '#發展權利剝奪', affects: { quality: 0.5, relationship: 0.5, health: 0.2 }, image: 'images/10.jpg' },
                        { price: 500, label: '基本書簿雜費', desc: '完全不補習，依賴學校資源。', quality: '😢', impact: '父母無力指導功課，成績容易落後。欠缺額外資源產生學習焦慮與自卑感。', concept: '#跨代貧窮', affects: { quality: 1, relationship: 0.8, health: 0.5 }, image: 'images/11.jpg' }
                    ],
                    abandonOption: { impact: '徹底剝奪子女受教權，未來毫無希望，並可能觸犯法例引起社會福利署介入。', concept: '#剝奪教育權', affects: { quality: 3, relationship: 4, health: 1 } }
                },
                {
                    id: 'medical',
                    title: '醫療健康 (Medical)',
                    icon: <IconStethoscope className="w-6 h-6 text-red-500" />,
                    options: [
                        { price: 800, label: '私家診所', desc: '生病即看私家醫生', quality: '🙂', impact: '', image: 'images/12.jpg' },
                        { price: 200, label: '公立門診', desc: '清晨排籌或輪候急症。', quality: '😐', impact: '需花費大量時間輪候，小病拖成大病。生病期間無法休息，身心俱疲。', concept: '#醫療可達性', affects: { quality: 0.5, relationship: 0.5, health: 0.8 }, image: 'images/13.jpg' },
                        { price: 50, label: '成藥/忍痛', desc: '自行買藥或忍耐，極少看醫生。', quality: '😢', impact: '缺乏專業診斷，存在誤診風險。長期痛症導致脾氣暴躁，影響家庭和諧。', concept: '#健康不平等', affects: { quality: 1, relationship: 1.2, health: 1.5 }, image: 'images/14.jpg' }
                    ],
                    abandonOption: { impact: '小病拖成絕症，長期忍受極大身心折磨，生命隨時受到嚴重威脅。', concept: '#醫療貧乏', affects: { quality: 2.5, relationship: 2, health: 4.5 } }
                },
                {
                    id: 'utilities',
                    title: '水電煤網 (Utilities)',
                    icon: <IconAlertCircle className="w-6 h-6 text-yellow-500" />,
                    options: [
                        { price: 1000, label: '舒適使用', desc: '夏天開冷氣、穩定上網', quality: '🙂', impact: '', image: 'images/15.jpg' },
                        { price: 700, label: '審慎使用', desc: '限時開冷氣，時刻留意電錶。', quality: '😐', impact: '為省電即使熱也只開風扇。全家人精神緊張，時常為「誰忘了關燈」而爭吵。', concept: '#能源焦慮', affects: { quality: 0.5, relationship: 0.5, health: 0.2 }, image: 'images/16.jpg' },
                        { price: 400, label: '極限慳電', desc: '不開冷氣，取消家居寬頻。', quality: '😢', impact: '酷熱難眠影響精神及日間表現；數碼鴻溝導致孩子無法在家完成網上作業。', concept: '#數碼鴻溝', affects: { quality: 1.2, relationship: 0.8, health: 1 }, image: 'images/17.jpg' }
                    ],
                    abandonOption: { impact: '無法煮食、洗澡或照明，生活退化至原始狀態，夏天極酷熱冬天極嚴寒。', concept: '#能源貧窮', affects: { quality: 3, relationship: 2.5, health: 2.5 } }
                },
                {
                    id: 'clothes',
                    title: '衣物鞋履 (Clothing)',
                    icon: <IconShirt className="w-6 h-6 text-purple-500" />,
                    options: [
                        { price: 500, label: '基本添置', desc: '應付換季需求，有得體的上班服與校服。', quality: '🙂', impact: '', image: 'images/18.jpg' },
                        { price: 200, label: '特價網購', desc: '主要購買平價衣物，質料略差', quality: '😐', impact: '大人穿磨損鞋子影響求職形象；孩子因穿廉價服飾在同儕間感到自卑。', concept: '#物質匱乏', affects: { quality: 0.5, relationship: 0.2, health: 0.1 }, image: 'images/19.jpg' },
                        { price: 0, label: '舊衣縫補', desc: '拾二手衣物，鞋底磨平仍穿。', quality: '😢', impact: '寒冬缺乏保暖厚衣。破舊衣履導致社交退縮；孩子衣不稱身遭受排擠。', concept: '#社會排斥', affects: { quality: 1, relationship: 0.8, health: 0.5 }, image: 'images/20.jpg' }
                    ],
                    abandonOption: { impact: '嚴重影響個人衛生與尊嚴，遭受極端的社會歧視與驅離，甚至可能觸及法例。', concept: '#極度匱乏', affects: { quality: 3.5, relationship: 3.5, health: 2 } }
                }
            ];

            // 透過圖片 CDN 自動化壓縮高畫質原圖，防止記憶體溢出
            const getOptimizedImage = (url) => {
                if (!url) return '';
                // 如果是本地 images 資料夾內的圖片，直接返回原始路徑 (不透過 CDN 處理)
                if (url.startsWith('images/')) return url;
                if (url.includes('wsrv.nl') || url.includes('placehold.co') || url.includes('via.placeholder')) return url;
                const cleanUrl = url.replace(/(^\w+:|^)\/\//, '');
                return `https://wsrv.nl/?url=${cleanUrl}&w=800&q=75&output=webp`;
            };

            // === 頁面載入時自動預載圖片 ===
            useEffect(() => {
                const imageUrls = [];
                categories.forEach(cat => {
                    cat.options.forEach(opt => {
                        if (opt.image) {
                            imageUrls.push(getOptimizedImage(opt.image));
                        }
                    });
                });

                if (imageUrls.length === 0) {
                    setGamePhase('intro');
                    return;
                }

                let loadedCount = 0;
                const totalImages = imageUrls.length;

                Promise.all(imageUrls.map(url => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.src = url;
                        img.onload = () => { 
                            loadedCount++; 
                            setLoadingProgress(Math.round((loadedCount / totalImages) * 100)); 
                            resolve(); 
                        };
                        img.onerror = () => { 
                            loadedCount++; 
                            setLoadingProgress(Math.round((loadedCount / totalImages) * 100)); 
                            resolve(); 
                        };
                    });
                })).then(() => {
                    setTimeout(() => setGamePhase('intro'), 600); // 稍微延遲讓玩家看到 100% 滿格後自動進入首頁
                });
            }, []); // 空陣列確保只在組件掛載時執行一次

            // 計算總支出 (跳過 null 值)
            const totalExpenses = Object.keys(choices).reduce((acc, key) => {
                if (choices[key] === null) return acc;
                const category = categories.find(c => c.id === key);
                if (!category) return acc;
                const selectedOpt = category.options[choices[key]];
                return acc + (selectedOpt ? selectedOpt.price : 0);
            }, 0);

            const balance = INCOME - totalExpenses;
            const isDeficit = balance < 0;

            const handleSelect = (categoryId, optionIndex) => {
                setChoices(prev => ({ ...prev, [categoryId]: optionIndex }));
                setAnimationClass('animate-bounce-custom');
                setTimeout(() => setAnimationClass(''), 300);
            };

            const calculateScores = () => {
                let scores = { quality: 100, relationship: 100, health: 100 };
                const MULTIPLIER = 12; // 調整倍率以平衡極端選項的重扣分
                
                Object.keys(choices).forEach(key => {
                    const category = categories.find(c => c.id === key);
                    if (!category) return;
                    
                    let affects = null;
                    // 如果沒有選擇，自動套用放棄的懲罰；如果有選擇，套用選項的懲罰
                    if (choices[key] === null) {
                        affects = category.abandonOption.affects;
                    } else if (category.options[choices[key]]?.affects) {
                        affects = category.options[choices[key]].affects;
                    }

                    if (affects) {
                        if (affects.quality) scores.quality -= (affects.quality * MULTIPLIER);
                        if (affects.relationship) scores.relationship -= (affects.relationship * MULTIPLIER);
                        if (affects.health) scores.health -= (affects.health * MULTIPLIER);
                    }
                });

                return {
                    quality: Math.max(0, scores.quality),
                    relationship: Math.max(0, scores.relationship),
                    health: Math.max(0, scores.health)
                };
            };

            const scores = calculateScores();

            // 獲取目前完成度
            const selectedCount = Object.values(choices).filter(v => v !== null).length;
            const allSelected = selectedCount === categories.length;

            const getScoreColor = (score) => {
                if (score === undefined || isNaN(score)) return 'text-red-400';
                if (score >= 80) return 'text-green-400';
                if (score >= 50) return 'text-amber-400';
                return 'text-red-500';
            };

            const getBarColor = (score) => {
                if (score === undefined || isNaN(score)) return 'bg-red-500';
                if (score >= 80) return 'bg-green-500';
                if (score >= 50) return 'bg-amber-500';
                return 'bg-red-600';
            };

                                    <h4 className="font-bold text-base md:text-lg text-slate-800 border-b border-slate-200 pb-3 flex items-center gap-2 mb-4">
                                        <IconAlertCircle className="w-5 h-5 text-red-500" /> 選擇的代價
                                    </h4>
                                    
                                    <div className="max-h-[30vh] overflow-y-auto pr-2 space-y-4">
                                        {activeImpacts.length > 0 ? activeImpacts.map((impact, i) => (
                                            <div key={i} className={`flex gap-3 text-sm items-start bg-white p-3 rounded-lg border shadow-sm ${impact.isAbandon ? 'border-red-300 ring-1 ring-red-100' : 'border-slate-100'}`}>
                                                <div className={`p-1.5 rounded mt-0.5 ${impact.isAbandon ? 'bg-red-100 text-red-600' : 'bg-slate-100 text-slate-500'}`}>
                                                    <IconAlertCircle className="w-4 h-4" />
                                                </div>
                                                <div>
                                                    <div className="font-bold text-slate-800 mb-1 flex items-center gap-2 flex-wrap">
                                                        {impact.title}
                                                        {impact.isAbandon && <span className="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded shadow-sm">完全放棄</span>}
                                                        {impact.concept && <span className="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">{impact.concept}</span>}
                                                    </div>
                                                    <span className={`${impact.isAbandon ? 'text-red-700 font-medium' : 'text-slate-600'} leading-relaxed`}>{impact.text}</span>
                                                </div>
                                            </div>
                                        )) : (
                                            <p className="text-center text-green-600 font-bold text-base py-6 bg-green-50 rounded-lg border border-green-100">
                                                奇蹟！您在預算內維持了完美的生活狀態。
                                            </p>
                                        )}
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={() => { 
                                        setShowResult(false); 
                                        setChoices({housing: null, food: null, transport: null, education: null, medical: null, utilities: null, clothes: null}); 
                                        window.scrollTo(0,0);
                                    }} 
                                    className="w-full bg-slate-800 text-white py-4 rounded-xl font-bold text-lg hover:bg-slate-700 active:scale-95 transition-transform shadow-lg"
                                >
                                    重新體驗
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 防崩潰機制
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMessage: '' };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorMessage: error.toString() };
            }
            componentDidCatch(error, errorInfo) {
                console.error("App Crashed:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6">
                            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border-t-4 border-red-500 text-center">
                                <IconAlertCircle className="w-12 h-12 text-red-500 mx-auto mb-4" />
                                <h2 className="text-2xl font-bold text-slate-800 mb-2">系統出現異常</h2>
                                <p className="text-sm text-slate-600 mb-6">發生錯誤，請重新載入。</p>
                                <button onClick={() => window.location.reload()} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">
                                    重新載入網頁
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><PovertySim /></ErrorBoundary>);
    </script>
</body>
</html>
